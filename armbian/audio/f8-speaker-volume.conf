context.properties = { log.level = 2 }
context.spa-libs = { audio.convert.* = audioconvert/libspa-audioconvert support.* = support/libspa-support }
context.modules = [
 { name = libpipewire-module-protocol-native }
 { name = libpipewire-module-client-node }
 { name = libpipewire-module-adapter }
 { name = libpipewire-module-filter-chain
   args = {
    node.description = "F8 Speakers"
    media.name = "F8 Speaker Volume Curve"
    filter.graph = {
     nodes = [
      { type = ladspa name = left plugin = /usr/lib/f8-pro/f8-soft-volume.so label = f8_soft_volume control = { "Volume" = 0.0 } }
      { type = ladspa name = right plugin = /usr/lib/f8-pro/f8-soft-volume.so label = f8_soft_volume control = { "Volume" = 0.0 } }
     ]
     inputs = [ "left:In" "right:In" ]
     outputs = [ "left:Out" "right:Out" ]
     capture.volumes = [
      { control = "left:Volume" min = 0.0 max = 1.0 scale = linear }
      { control = "right:Volume" min = 0.0 max = 1.0 scale = linear }
     ]
    }
    audio.channels = 2
    audio.position = [ FL FR ]
    capture.props = {
     node.name = f8-speaker-volume
     node.description = "F8 Speakers"
     media.class = Audio/Sink
     priority.session = 1100
     node.virtual = true
     volume = 0.001352
    }
    playback.props = {
     node.name = f8-speaker-volume-output
     node.passive = true
     target.object = "alsa_output.platform-es8388-sound.HiFi__Speaker__sink"
     stream.dont-remix = true
    }
   }
 }
]
