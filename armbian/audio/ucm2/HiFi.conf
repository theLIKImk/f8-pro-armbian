SectionVerb {
    EnableSequence [
        cset "name='Speaker Switch' off"
        cset "name='Headphone Switch' off"
        cset "name='OUT1 Switch' off"
        cset "name='OUT2 Switch' off"
        # Fixed analog pad; desktop volume is controlled by the PCM element.
        cset "name='Output 2 Playback Volume' 24,24"
        cset "name='Left Mixer Left Playback Switch' on"
        cset "name='Right Mixer Right Playback Switch' on"
    ]
    DisableSequence [
        cset "name='Speaker Switch' off"
        cset "name='OUT2 Switch' off"
    ]
    Value {
        TQ "HiFi"
    }
}

SectionDevice."Speaker" {
    Comment "Built-in Speakers"
    EnableSequence [
        cset "name='OUT2 Switch' on"
        cset "name='Speaker Switch' on"
    ]
    DisableSequence [
        cset "name='Speaker Switch' off"
        cset "name='OUT2 Switch' off"
    ]
    Value {
        PlaybackPriority 200
        PlaybackPCM "hw:${CardId},0"
        PlaybackChannels 2
        PlaybackMixerElem "PCM"
    }
}

SectionDevice."Mic" {
    Comment "Built-in Microphone"
    EnableSequence [
        cset "name='Left Channel Capture Volume' 8"
        # The built-in speech signal is on the left ADC. Avoid amplifying
        # the noise-only right input, and bound automatic capture gain.
        cset "name='Right Channel Capture Volume' 0"
        cset "name='ALC Capture Function' Left"
        cset "name='ALC Capture Max PGA' 5"
        cset "name='ALC Capture Min PGA' 0"
        cset "name='Capture Digital Volume' 192"
        cset "name='Capture Mute' off"

        cset "name='ADC Data Select' 'Left Left'"
        cset "name='Left PGA Mux' 'DifferentialL'"
        cset "name='Right PGA Mux' 'DifferentialR'"
    ]
    DisableSequence [
        cset "name='Capture Mute' on"
    ]
    Value {
        CapturePriority 200
        CapturePCM "hw:${CardId},0"
        CaptureChannels 2
        CaptureMixerElem "Capture Digital"
    }
}
