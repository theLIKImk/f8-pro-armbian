# Candidate only: validate target CLI, theme focus behavior and real display first.
# Do not install/enable automatically before the timed GPU session passes.
[General]
DisplayServer=wayland
# Target SDDM clears qtvirtualkeyboard on Wayland. KWin starts Maliit instead.
InputMethod=

[Theme]
Current=debian-breeze

[Wayland]
CompositorCommand=/usr/bin/env KWIN_IM_SHOW_ALWAYS=1 /usr/bin/kwin_wayland --drm --no-lockscreen --no-global-shortcuts --locale1 --inputmethod /usr/bin/maliit-keyboard
